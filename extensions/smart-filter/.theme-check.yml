# Theme Check must use the theme-app-extension preset. Without it, ValidSchema
# treats app blocks as theme sections and rejects target/enabled_on/stylesheet/javascript.
extends: theme-check:theme-app-extension

# App-block JS/CSS is larger than Theme Check’s default 10 KB demo threshold.
# Shopify’s platform cap is 100000 B on the files named in schema javascript /
# stylesheet (AssetSizeAppBlockJavaScript / AssetSizeAppBlockCSS).
AssetSizeAppBlockJavaScript:
  enabled: true
  threshold_in_bytes: 100000

AssetSizeAppBlockCSS:
  enabled: true
  threshold_in_bytes: 100000
