packages:
  - "extensions/*"

# Hostinger: also set node-linker + package-import-method=copy in .npmrc.
# Workspace nodeLinker alone is ignored by Hostinger's pnpm (still uses virtual store).
nodeLinker: hoisted

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  msgpackr-extract: true
  unrs-resolver: true
  "@parcel/watcher": true
