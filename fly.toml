# Fly.io config for Findly: Smart Filters & Search
# Secrets (via `fly secrets set`): SHOPIFY_API_SECRET, DATABASE_URL, REDIS_URL, BILLING_TEST_MODE
# Non-secret env below; set SHOPIFY_API_KEY / SHOPIFY_APP_URL after `fly launch`

app = "findly-smart-filters-search"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SCOPES = "read_products,write_products,read_files,write_files"

[processes]
  web = "npm run docker-start"
  worker = "npm run worker"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["web"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
