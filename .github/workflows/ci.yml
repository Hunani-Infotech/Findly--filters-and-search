on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SHOPIFY_APP_URL: https://findly.hunaniinfotech.com
      SCOPES: read_products,read_files,write_files
      REDIS_URL: redis://127.0.0.1:6379
    strategy:
      matrix:
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma
        run: npx prisma generate && npx prisma validate

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npx eslint --ignore-path .gitignore --no-cache .

      - name: Build application
        run: npm run build
