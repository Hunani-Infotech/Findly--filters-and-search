name: Loader guard

on:
  schedule:
    # Daily scan. It does not install dependencies or start the app.
    - cron: "15 2 * * *"
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Reject injected Node loaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
      - name: Scan for injected loaders
        run: node scripts/check-supply-chain.mjs
